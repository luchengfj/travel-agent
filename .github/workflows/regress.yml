# 行旅 · Travel Agent 静态回归门禁
#
# 为什么只跑这一条：examples/regress.py 纯标准库、零依赖、不联网、
# 不调 LLM、不渲染图片，天然适合当 CI 门禁。它验四件事：
#   [A] 主提示词结构（20 章节 / 7 图卡 / 21 条硬规则 / 出境 5 附加块）
#   [B] 四个样例的算术重算（分项=合计、人均、口径、汇率换算）
#   [C] 基准完整性（行数 / 63 条检查点 / 正确值锚点 / bug 记录区）
#   [D] 断言自检（断言配置没被删空，每条防复发正则都认得自己的错值）
# 退出码 0=全绿，1=有 FAIL。任一硬事实/口径/结构不符即拦下这次改动。
#
# 边界（README 已写明）：静态全绿 ≠ 行为没退化。逐轮行为对照、图卡
# 像素级目检、实时数据现查仍需人工，且脚本刻意不联网，避免 CI 因外部
# 数据源抖动变红。

name: 回归门禁 (regress)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: regress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regress:
    name: 静态回归 · PASS 全绿才算过
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 门禁 · 跑静态回归
        run: python examples/regress.py

      # 失败时也要留报告，方便直接看是哪条断言红了
      - name: 生成留档报告
        if: always()
        run: python examples/regress.py --report

      - name: 上传回归报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regress-report-${{ github.sha }}
          path: examples/report.md
          if-no-files-found: warn

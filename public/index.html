<style>

  body {

    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, var(--brand1), var(--brand2));

    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;

  .brand { font-size: 18px; font-weight: 700; letter-spacing: .5px; }

  .hbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  main { flex: 1; overflow-y: auto; padding: 20px 16px 28px; }
  .wrap { max-width: 900px; margin: 0 auto; }

  .welcome { text-align: center; margin-top: 8vh; }
  .welcome h2 { font-size: 24px; margin: 0 0 18px; }
  .chips { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .chip {
    width: min(560px, 92vw);
    text-align: left;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 14px;
    cursor: pointer;
    transition: all .15s;
    color: var(--ink);
  }
  .chip:hover { border-color: var(--brand1); box-shadow: 0 2px 12px rgba(79,70,229,.12); transform: translateY(-1px); }
  .tip { color: var(--sub); font-size: 12px; margin-top: 18px; }

  .msg { display: flex; margin: 14px 0; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 86%; border-radius: 14px; padding: 10px 14px; font-size: 14.5px; line-height: 1.65; }
  .msg.user .bubble { background: var(--brand1); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.ai .bubble { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; width: 100%; max-width: 100%; }

  .steps { margin: 4px 0 10px; }
  .step { display: flex; align-items: baseline; gap: 8px; font-size: 13px; color: var(--sub); padding: 3px 0; }
  .dot { width: 14px; text-align: center; flex: none; }

  .step.running .label { color: var(--brand1); }
  .step.done .dot { color: var(--ok); }
  .step.done .detail { color: var(--ink); }
  .step.error .dot { color: var(--err); }
  .step.error .detail { color: var(--err); }
  @keyframes pulse { 50% { opacity: .3; } }
  .detail { font-size: 12.5px; }

  .pricegroup { margin: 10px 0; }
  .pricegroup h4 { margin: 0 0 8px; font-size: 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .pcard { background: #fafbff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
  .pcard .t { font-weight: 600; margin-bottom: 3px; }
  .pcard .s { color: var(--sub); font-size: 12px; line-height: 1.5; }
  .pcard .p { font-size: 16px; font-weight: 700; color: var(--brand1); margin-top: 6px; }
  .pcard .tags { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }

  .badge.\31 2306, .ref-12306 { background: #dbeafe; color: #1d4ed8; }
  .badge.estimate, .ref-estimate { background: #ffedd5; color: var(--warn); }
  .badge.none, .ref-none { background: #f3f4f6; color: var(--sub); }
  .note { font-size: 12px; color: var(--sub); margin-top: 6px; }
  .note.warn { color: var(--warn); }
  .setupbox { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #92400e; }

  .errline { display: none; color: var(--err); font-size: 13px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
  .errline:empty { display: none; }
  .question { font-size: 14.5px; }

  /* ---------- 攻略图 ---------- */
  .plan { font-size: 14px; }
  .plan-hero {
    background: linear-gradient(135deg, #eef2ff, #e0f2fe);

  .hero-flex { display: flex; gap: 14px; align-items: stretch; }
  .hero-left { flex: 1; min-width: 0; }
  .hero-img { flex: none; width: 190px; height: 116px; object-fit: cover; border-radius: 10px; border: 1px solid #e0e7ff; background: #e0e7ff; }

  .plan-hero .summary { color: #4b5563; font-size: 13.5px; margin-bottom: 10px; }
  .meta-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .mchip { font-size: 12.5px; background: #fff; border: 1px solid #e0e7ff; border-radius: 999px; padding: 4px 12px; color: var(--ink); }
  .mchip b { color: var(--brand1); }

  .plan-map { height: 360px; width: 100%; }
  .map-note { font-size: 11.5px; color: var(--sub); background: #fff; padding: 6px 12px; border-top: 1px solid var(--line); }

  .plan-day { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .day-head { padding: 9px 14px; font-weight: 700; font-size: 14.5px; color: #fff; display: flex; gap: 10px; align-items: baseline; }

  .seg { display: flex; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); align-items: stretch; background: #fff; }
  .seg:first-of-type { border-top: none; }
  .seg-time { flex: none; width: 88px; font-size: 12px; font-weight: 700; color: var(--brand1); padding-top: 4px; }
  .seg-thumb {
    flex: none; width: 64px; height: 64px; border-radius: 8px; overflow: hidden;

    font-size: 22px; font-weight: 700; background-size: cover; background-position: center;
  }
  .seg-thumb-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .seg-main { flex: 1; min-width: 0; }
  .seg-title { font-weight: 600; font-size: 14px; }
  .seg-place { color: var(--sub); font-size: 12.5px; margin-top: 2px; }
  .seg-note { color: #92400e; font-size: 12px; margin-top: 3px; }
  .seg-cost { flex: none; align-self: center; text-align: right; }
  .seg-cost .c { font-weight: 700; font-size: 13.5px; }
  .seg-cost .ref { display: inline-block; margin-top: 4px; font-size: 10.5px; border-radius: 4px; padding: 1px 6px; font-weight: 600; }

  .plan-table { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
  .plan-table table { border-collapse: collapse; width: 100%; font-size: 13px; }

  .plan-table th { background: #f3f4f6; font-size: 12.5px; color: var(--sub); }
  .plan-links { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

  .plan-links a:hover { background: #eef2ff; }

  .weather-box { border: 1px solid #e0f2fe; background: linear-gradient(135deg, #f0f9ff, #e0f2fe); border-radius: 16px; padding: 12px 16px; margin-bottom: 16px; animation: rise .35s ease both; }
  .wx-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; }

  .wx-date { font-size: 12px; color: var(--sub); }
  .wx-desc { font-size: 13px; margin: 2px 0; }
  .wx-temp { font-size: 13.5px; font-weight: 700; color: var(--brand1); }

  .plan-packing { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 14px; padding: 12px 16px; margin-bottom: 12px; }

  .packing-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px; }
  .packing-list li { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; background: #fff; border-radius: 8px; padding: 6px 10px; box-shadow: 0 1px 3px rgba(30,27,75,.05); cursor: pointer; }

  .plan-tips { background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; }

  .plan-tips li { font-size: 13px; color: #78350f; margin: 4px 0; }

  .plan-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .plan-actions button, .tools button {
    font-size: 12.5px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .plan-actions button:hover, .tools button:hover { border-color: var(--brand1); color: var(--brand1); }

  .md { font-size: 14px; line-height: 1.75; overflow-wrap: break-word; }
  .md h1, .md h2, .md h3 { line-height: 1.4; margin: 14px 0 8px; }
  .md h1 { font-size: 19px; border-bottom: 2px solid #e0e7ff; padding-bottom: 6px; }
  .md h2 { font-size: 16.5px; }
  .md h3 { font-size: 15px; }
  .md table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; }
  .md th { background: #f3f4f6; }
  .md pre { background: #f6f8fa; padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12.5px; }
  .md code { background: #f6f8fa; border-radius: 4px; padding: 1px 5px; font-size: 12.5px; }
  .md ul, .md ol { padding-left: 20px; }
  .md blockquote { margin: 8px 0; padding: 6px 12px; border-left: 3px solid var(--brand1); background: #eef2ff; color: #3730a3; border-radius: 0 8px 8px 0; }

  footer { background: #fff; border-top: 1px solid var(--line); padding: 12px 16px; }
  .inputbar { max-width: 900px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea#input {
    flex: 1;

  }

  #send {
    border: none;
    background: linear-gradient(135deg, var(--brand1), var(--brand2));

    font-size: 14.5px;
    font-weight: 600;
    border-radius: 12px;
    padding: 11px 20px;

  }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  .hint { max-width: 900px; margin: 6px auto 0; font-size: 11.5px; color: var(--sub); text-align: center; }

  /* ---------- 打印 ---------- */
  #printroot { display: none; }

  @media print {
    body { background: #fff; }

  /* ============ 视觉升级层 ============ */
  body {

      radial-gradient(1200px 500px at 85% -120px, rgba(79, 70, 229, .09), transparent 60%),

  .welcome h2 {

<body>
<header>
  <div class="brand">🧭 旅行规划 Agent
    <small>实时生成攻略图 · 时间轴 + 路线图 + 实景图 + 价格表</small>
  </div>
  <div class="hbar">
    <button id="newChat" title="清空对话重新开始">＋ 新对话</button>
  </div>
</header>

<main id="chat">
  <div class="wrap" id="thread">
    <div class="welcome" id="welcome">
      <h2>告诉我你的出行想法 ✈️</h2>
      <div class="chips">
        <button class="chip">11月28日-30日 北京去东京，2人，预算6000，喜欢美食和红叶</button>
        <button class="chip">下周末从上海出发去杭州玩2天，坐高铁，想住西湖附近</button>
        <button class="chip">12月初成都-重庆 3天2晚，想吃火锅、看熊猫，预算3000</button>
      </div>
      <p class="tip">生成完整攻略图：逐日时间轴 + 地图路线 + 景点实景图 + 实时价格表，可打印成 PDF 或下载分享。机票实时价来自 Travelpayouts（Trip.com 等报价源），火车票走 12306/估算，均标注来源；价格仅供参考。</p>
    </div>
  </div>
</main>

<div id="printroot"></div>

<footer>
  <div class="inputbar">
    <textarea id="input" rows="1" placeholder="例如：12月10-14日 广州出发去北京2人，预算8000，想看雪和故宫"></textarea>
    <button id="send">发送 ➤</button>
  </div>
  <div class="hint">Enter 发送 · Shift+Enter 换行 · 行程和报价仅供参考，下单前以预订页为准</div>
</footer>

<script>
(function () {
  'use strict';
  var thread = document.getElementById('thread');
  var welcome = document.getElementById('welcome');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var PALETTE = ['#4f46e5', '#0ea5e9', '#059669', '#d97706', '#dc2626', '#7c3aed'];
  var TYPE_ICON = { transport: '🚄', sight: '🏛️', food: '🍜', hotel: '🏨', shopping: '🛍️', rest: '☕' };
  var REF_LABEL = { amadeus: '实时 · Amadeus', travelpayouts: '实时 · Travelpayouts', wikivoyage: '参考价 · Wikivoyage', 12306: '实时 · 12306', estimate: '估算', none: '以预订页为准' };
  var state = { messages: [], busy: false, lastMd: '' };

  // ---------- 工具 ----------
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function renderMd(md) {
    if (window.marked && marked.parse) {
      try { return marked.parse(md); } catch (e) { /* fallthrough */ }
    }
    return '<pre style="white-space:pre-wrap">' + md.replace(/</g, '&lt;') + '</pre>';
  }
  function scrollBottom() {
    var main = document.getElementById('chat');
    main.scrollTop = main.scrollHeight;
  }
  function money(n) {
    return '¥' + Number(n).toLocaleString('zh-CN', { maximumFractionDigits: 0 });
  }

  // ---------- 实景图：经服务端 /api/img 代理（Wikidata/Commons，按类型决定兜底策略） ----------
  var IMG_VER = 'v4'; // 图片策略升级时递增，避免浏览器旧缓存
  function imgSrc(place, lat, lng, strict) {
    var u = '/api/img?_v=' + IMG_VER + '&q=' + encodeURIComponent(place || '');
    if (lat && lng) u += '&lat=' + lat + '&lng=' + lng;
    if (strict) u += '&strict=1';
    return u;
  }

  // ---------- 查实时价深链 ----------
  function buildDeepLinks(p) {
    var o = p.origin || {}, d = p.destination || {};
    var date = p.depart_date || '';
    var ret = p.return_date || '';
    var adults = p.travelers || 1;
    var links = [];
    if (o.iata && d.iata && date) {
      var fl = ret
        ? 'https://flights.ctrip.com/online/list/round-' + o.iata + '-' + d.iata + '?depdate=' + date + '&arrdate=' + ret
        : 'https://flights.ctrip.com/online/list/oneway-' + o.iata + '-' + d.iata + '?depdate=' + date;
      links.push({ label: '✈️ 携程查机票', url: fl });
    }
    if (o.city && d.city && date) {
      var fs = encodeURIComponent(o.city) + (o.train_code ? ',' + o.train_code : '');
      var ts = encodeURIComponent(d.city) + (d.train_code ? ',' + d.train_code : '');
      links.push({
        label: '🚄 12306 查火车票',
        url: 'https://kyfw.12306.cn/otn/leftTicket/init?linktypeid=dc&fs=' + fs + '&ts=' + ts + '&date=' + date + '&flag=N,N,N'
      });
    }
    if (d.city && date) {
      links.push({
        label: '🏨 Booking 查酒店',
        url: 'https://www.booking.com/searchresults.zh-cn.html?ss=' + encodeURIComponent(d.city) +
          '&checkin=' + date + (ret ? '&checkout=' + ret : '') + '&group_adults=' + adults + '&no_rooms=1'
      });
    }
    if (d.city) {
      links.push({ label: '🎟️ 携程查门票/活动', url: 'https://you.ctrip.com/searchsite/?query=' + encodeURIComponent(d.city) });
    }
    return links;
  }

  // ---------- 攻略图渲染 ----------
  function mdFromPlan(p) {
    var L = ['# ' + (p.title || '旅行攻略'), ''];
    if (p.summary) L.push(p.summary, '');
    L.push('- 日期：' + (p.depart_date || '') + (p.return_date ? (' 至 ' + p.return_date) : ''));
    L.push('- 人数：' + (p.travelers || 1));
    L.push('- 预算：' + (p.budget_cny ? money(p.budget_cny) : '未指定'));
    if (p.estimated_total && (p.estimated_total.min || p.estimated_total.max)) {
      var t = '预计总花费：' + (p.estimated_total.min ? money(p.estimated_total.min) : '?') +
        ' ~ ' + (p.estimated_total.max ? money(p.estimated_total.max) : '?');
      if (p.estimated_total.note) t += '（' + p.estimated_total.note + '）';
      L.push('- ' + t);
    }
    (p.days || []).forEach(function (d) {
      L.push('', '## Day ' + d.day + (d.date ? ' · ' + d.date : '') + (d.theme ? ' · ' + d.theme : ''));
      (d.segments || []).forEach(function (s) {
        var line = '- **' + (s.time || '') + '** ' + s.title + (s.place ? '（' + s.place + '）' : '');
        if (s.transport) line += ' · ' + s.transport;
        if (s.cost) line += ' · ' + s.cost;
        if (s.note) line += ' — ' + s.note;
        L.push(line);
      });
    });
    if (p.price_summary && p.price_summary.length) {
      L.push('', '## 价格汇总', '', '| 类别 | 选项 | 价格 | 来源 |', '|---|---|---|---|');
      p.price_summary.forEach(function (r) {
        L.push('| ' + (r.category || '') + ' | ' + (r.option || '') + ' | ' + (r.price || '') + ' | ' + (r.source || '') + ' |');
      });
    }
    if (p.packing && p.packing.length) {
      L.push('', '## 行前打包清单');
      p.packing.forEach(function (t) { L.push('- [ ] ' + t); });
    }
    if (p.tips && p.tips.length) {
      L.push('', '## 预订建议');
      p.tips.forEach(function (t) { L.push('- ' + t); });
    }
    return L.join('\n');
  }

  function addAi() {
    var m = el('div', 'msg ai');
    var b = el('div', 'bubble');
    var steps = el('div', 'steps');
    var prices = el('div', 'pricezone');
    var qbox = el('div', 'question');
    var err = el('div', 'errline');
    var md = el('div', 'md');
    var planBox = el('div', 'plan');
    b.appendChild(steps); b.appendChild(prices); b.appendChild(qbox); b.appendChild(err); b.appendChild(planBox); b.appendChild(md);
    m.appendChild(b);
    thread.appendChild(m);

    var ui = {
      root: m, steps: steps, prices: prices, qbox: qbox, err: err, md: md, planBox: planBox,
      planEl: null, planMap: null, stepEls: {}, weather: null, currency: null,
      // 汇率换算：把 "¥1,515" / "¥70 ~ ¥200" 追加当地货币近似值
      cvt: function (text) {
        if (!this.currency) return text;
        var r = this.currency.ratePerCny, sym = this.currency.symbol;
        return String(text).replace(/¥\s?([\d,]+(?:\.\d+)?)/g, function (m, n) {
          var v = parseFloat(String(n).replace(/,/g, ''));
          if (!isFinite(v)) return m;
          return m + '≈' + Math.round(v * r).toLocaleString('zh-CN') + sym;
        });
      },
      upsertStep: function (ev) {
        var s = this.stepEls[ev.id];
        if (!s) {
          s = el('div', 'step ' + ev.status);
          var dot = el('span', 'dot');
          var label = el('span', 'label', ev.label);
          var detail = el('span', 'detail');
          s.appendChild(dot); s.appendChild(label); s.appendChild(detail);
          this.stepEls[ev.id] = { node: s, dot: dot, detail: detail };
          this.steps.appendChild(s);
        } else {
          s.node.className = 'step ' + ev.status;
        }
        var d = this.stepEls[ev.id];
        d.dot.textContent = ev.status === 'running' ? '⏳' : (ev.status === 'done' ? '✓' : '✗');
        d.detail.textContent = ev.detail ? '（' + ev.detail + '）' : '';
        scrollBottom();
      },
      addPrices: function (ev) {
        var g = el('div', 'pricegroup');
        if (ev.source === 'none') {
          var box = el('div', 'setupbox');
          box.appendChild(el('div', '', ev.title));
          box.appendChild(el('div', 'note', ev.note || ''));
          g.appendChild(box);
        } else {
          var h = el('h4');
          h.textContent = ev.title + ' ';
          var badge = el('span', 'badge ' + ev.source,
            ev.source === 'amadeus' ? '实时 · Amadeus' : ev.source === 'travelpayouts' ? '实时 · Travelpayouts' : ev.source === 'wikivoyage' ? '参考价 · Wikivoyage' : ev.source === '12306' ? '实时 · 12306' : '估算');
          h.appendChild(badge);
          g.appendChild(h);
          var cards = el('div', 'cards');
          (ev.items || []).forEach(function (it) {
            var c = el('div', 'pcard');
            var tEl = el('div', 't', it.title);
            if (it.url) {
              var a = document.createElement('a');
              a.href = it.url;
              a.target = '_blank';
              a.rel = 'noopener';
              a.textContent = '预订 ↗';
              a.style.cssText = 'font-size:12px;color:#4f46e5;margin-left:8px;text-decoration:none;';
              tEl.appendChild(a);
            }
            c.appendChild(tEl);
            var selfUi = ui;
            if (it.subtitle) c.appendChild(el('div', 's', it.subtitle));
            if (it.price) c.appendChild(el('div', 'p', selfUi.cvt(it.price)));
            if (it.tags && it.tags.length) {
              var tw = el('div', 'tags');
              it.tags.forEach(function (t) { tw.appendChild(el('span', 'tag', t)); });
              c.appendChild(tw);
            }
            cards.appendChild(c);
          });
          g.appendChild(cards);
          if (ev.note) g.appendChild(el('div', 'note warn', 'ⓘ ' + ev.note));
        }
        this.prices.appendChild(g);
        scrollBottom();
      },
      showError: function (msg) {
        this.err.textContent = '⚠️ ' + msg;
        this.err.style.display = 'block';
      },
      /* ---------- 攻略图 ---------- */
      setPlan: function (p) {
        var self = this;
        if (this.planMap) { try { this.planMap.remove(); } catch (e) {} this.planMap = null; }
        this.planBox.innerHTML = '';
        this.md.innerHTML = '';
        state.lastMd = mdFromPlan(p);
        var plan = el('div', 'plan');
        this.planEl = plan;

        // Hero（左信息 + 右封面图）
        var hero = el('div', 'plan-hero');
        var heroFlex = el('div', 'hero-flex');
        var heroLeft = el('div', 'hero-left');
        heroLeft.appendChild(el('h2', '', '🗺️ ' + (p.title || '旅行攻略')));
        if (p.summary) heroLeft.appendChild(el('div', 'summary', p.summary));
        var chips = el('div', 'meta-chips');
        function chip(label, value) {
          var c = el('span', 'mchip', label + ' ');
          c.appendChild(el('b', '', value));
          return c;
        }
        chips.appendChild(chip('📅', (p.depart_date || '?') + (p.return_date ? ' ~ ' + p.return_date : '') + ((p.nights ? ' · ' + (p.nights + 1) + '天' + p.nights + '晚' : ''))));
        chips.appendChild(chip('🧑', (p.travelers || 1) + ' 人'));
        chips.appendChild(chip('💰 预算', p.budget_cny ? money(p.budget_cny) : '未指定'));
        if (p.estimated_total && (p.estimated_total.min || p.estimated_total.max)) {
          var et = (p.estimated_total.min ? money(p.estimated_total.min) : '?') + ' ~ ' + (p.estimated_total.max ? money(p.estimated_total.max) : '?');
          chips.appendChild(chip('📊 预计总花费', et));
        }
        if (this.currency) {
          chips.appendChild(chip('💱 汇率', '1元 ≈ ' + this.currency.ratePerCny.toFixed(1) + this.currency.symbol));
        }
        heroLeft.appendChild(chips);
        heroFlex.appendChild(heroLeft);
        var heroImg = document.createElement('img');
        heroImg.className = 'hero-img';
        heroImg.alt = (p.destination && p.destination.city) || '';
        heroImg.loading = 'eager';
        heroImg.src = imgSrc((p.destination && p.destination.city) || (p.days && p.days[0] && p.days[0].segments && p.days[0].segments[0] && p.days[0].segments[0].place) || '');
        heroImg.onerror = function () { heroImg.remove(); };
        heroFlex.appendChild(heroImg);
        hero.appendChild(heroFlex);
        plan.appendChild(hero);

        // 天气卡片（若已获取）
        if (this.weather && this.weather.items && this.weather.items.length) {
          var wxBox = el('div', 'weather-box');
          wxBox.appendChild(el('div', 'wx-title', '🌤 出行期间天气'));
          var wrow = el('div', 'wx-row');
          this.weather.items.forEach(function (d) {
            var w = el('div', 'wx-day');
            w.appendChild(el('div', 'wx-date', d.date.slice(5)));
            w.appendChild(el('div', 'wx-desc', d.desc));
            w.appendChild(el('div', 'wx-temp', d.min + '~' + d.max + '°C'));
            if (d.precip >= 30) w.appendChild(el('div', 'wx-rain', '☔ ' + d.precip + '%'));
            wrow.appendChild(w);
          });
          wxBox.appendChild(wrow);
          plan.appendChild(wxBox);
        }

        // 地图
        var allPts = [];
        (p.days || []).forEach(function (d) {
          (d.segments || []).forEach(function (s) {
            if (s.lat && s.lng) allPts.push({ s: s, d: d });
          });
        });
        var mapWrap = el('div', 'plan-map-wrap');
        var mapDiv = el('div', 'plan-map');
        mapWrap.appendChild(mapDiv);
        mapWrap.appendChild(el('div', 'map-note', '📍 路线图：按天标色连线 · 底图 © OpenStreetMap · 实景图片来自 Wikimedia Commons（经本服务代理加载）'));
        if (allPts.length && window.L) {
          plan.appendChild(mapWrap);
        }

        // 每日时间轴
        var daysBox = el('div', 'plan-days');
        (p.days || []).forEach(function (d, di) {
          var color = PALETTE[di % PALETTE.length];
          var day = el('div', 'plan-day');
          var head = el('div', 'day-head');
          head.style.background = color;
          head.appendChild(el('span', '', 'Day ' + d.day));
          head.appendChild(el('span', 'dsub', (d.date ? d.date : '') + (d.theme ? ' · ' + d.theme : '')));
          day.appendChild(head);
          var segsBox = el('div', 'segs');
          (d.segments || []).forEach(function (s) {
            var seg = el('div', 'seg');
            seg.appendChild(el('div', 'seg-time', s.time || ''));
            var thumb = el('div', 'seg-thumb', s.place ? s.place.charAt(0) : (TYPE_ICON[s.type] || '📌'));
            var imgEl = document.createElement('img');
            imgEl.className = 'seg-thumb-img';
            imgEl.loading = 'lazy';
            imgEl.alt = s.place || s.title || '';
            imgEl.src = imgSrc(s.place || s.title || '', s.lat, s.lng, s.type === 'food' || s.type === 'hotel' || s.type === 'shopping' || s.type === 'rest');
            imgEl.onerror = function () { imgEl.remove(); };
            thumb.appendChild(imgEl);
            seg.appendChild(thumb);
            var main = el('div', 'seg-main');
            main.appendChild(el('div', 'seg-title', (TYPE_ICON[s.type] || '📌') + ' ' + (s.title || s.place || '')));
            var placeLine = [s.place, s.transport].filter(Boolean).join(' · ');
            if (placeLine) main.appendChild(el('div', 'seg-place', '📍 ' + placeLine));
            if (s.note) main.appendChild(el('div', 'seg-note', '💡 ' + s.note));
            seg.appendChild(main);
            var cost = el('div', 'seg-cost');
            if (s.cost) cost.appendChild(el('div', 'c', self.cvt(s.cost)));
            cost.appendChild(el('span', 'ref ref-' + (s.price_ref || 'none'), REF_LABEL[s.price_ref || 'none'] || ''));
            seg.appendChild(cost);
            segsBox.appendChild(seg);
          });
          day.appendChild(segsBox);
          daysBox.appendChild(day);
        });
        plan.appendChild(daysBox);

        // 价格汇总表
        if (p.price_summary && p.price_summary.length) {
          var tbl = el('div', 'plan-table');
          var table = el('table');
          var thead = el('thead');
          var trh = el('tr');
          ['类别', '选项', '价格', '来源'].forEach(function (h) { trh.appendChild(el('th', '', h)); });
          thead.appendChild(trh); table.appendChild(thead);
          var tbody = el('tbody');
          p.price_summary.forEach(function (r) {
            var tr = el('tr');
            tr.appendChild(el('td', '', r.category || ''));
            tr.appendChild(el('td', '', r.option || ''));
            var tdP = el('td', '', r.price || '');
            tdP.style.fontWeight = '600';
            tdP.style.color = 'var(--brand1)';
            tr.appendChild(tdP);
            tr.appendChild(el('td', '', r.source || ''));
            tbody.appendChild(tr);
          });
          table.appendChild(tbody); tbl.appendChild(table);
          plan.appendChild(tbl);
        }

        // 查实时价深链
        var links = buildDeepLinks(p);
        if (links.length) {
          var linksBox = el('div', 'plan-links');
          links.forEach(function (l) {
            var a = document.createElement('a');
            a.href = l.url;
            a.target = '_blank';
            a.rel = 'noopener';
            a.textContent = l.label;
            linksBox.appendChild(a);
          });
          plan.appendChild(linksBox);
        }

        // 行前打包清单（可勾选，进度存 localStorage）
        if (p.packing && p.packing.length) {
          var pack = el('div', 'plan-packing');
          var packTitle = el('h4', '', '🎒 行前打包清单（点击勾选）');
          pack.appendChild(packTitle);
          var saved = [];
          try { saved = JSON.parse(localStorage.getItem('packing:' + (p.title || '')) || '[]'); } catch (e) { saved = []; }
          var ul = el('ul', 'packing-list');
          var inputs = [];
          function persist() {
            var s = [];
            inputs.forEach(function (c, i) { if (c.checked) s.push(i); });
            try { localStorage.setItem('packing:' + (p.title || ''), JSON.stringify(s)); } catch (e) { /* 忽略 */ }
          }
          p.packing.forEach(function (item, i) {
            var li = el('li');
            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = saved.indexOf(i) >= 0;
            if (cb.checked) li.className = 'checked';
            cb.addEventListener('change', function () {
              li.className = cb.checked ? 'checked' : '';
              persist();
            });
            li.appendChild(cb);
            li.appendChild(el('span', '', item));
            inputs.push(cb);
            ul.appendChild(li);
          });
          pack.appendChild(ul);
          plan.appendChild(pack);
        }

        // 预订建议
        if (p.tips && p.tips.length) {
          var tips = el('div', 'plan-tips');
          tips.appendChild(el('h4', '', '💡 预订建议'));
          var ul = el('ul');
          p.tips.forEach(function (t) { ul.appendChild(el('li', '', t)); });
          tips.appendChild(ul);
          plan.appendChild(tips);
        }

        // 操作按钮
        var actions = el('div', 'plan-actions');
        function btn(text) { return el('button', '', text); }
        var bCopy = btn('📋 复制攻略(Markdown)');
        bCopy.onclick = function () {
          navigator.clipboard.writeText(mdFromPlan(p)).then(function () {
            bCopy.textContent = '✅ 已复制';
            setTimeout(function () { bCopy.textContent = '📋 复制攻略(Markdown)'; }, 1500);
          });
        };
        var bMd = btn('⬇️ 行程.md');
        bMd.onclick = function () {
          var blob = new Blob([mdFromPlan(p)], { type: 'text/markdown;charset=utf-8' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = (p.title || '旅行攻略') + '.md';
          a.click();
          URL.revokeObjectURL(a.href);
        };
        var bHtml = btn('🖼️ 下载攻略.html（分享用）');
        bHtml.onclick = function () {
          var styles = Array.prototype.map.call(document.querySelectorAll('style'), function (s) { return s.outerHTML; }).join('\n');
          var leafletCss = '<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">';
          var html = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">' +
            '<meta name="viewport" content="width=device-width, initial-scale=1">' +
            '<title>' + (p.title || '旅行攻略') + '</title>' + leafletCss + styles +
            '</head><body style="background:#f5f6fa"><div style="max-width:900px;margin:20px auto;padding:0 16px">' +
            plan.outerHTML + '</div></body></html>';
          var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = (p.title || '旅行攻略') + '.html';
          a.click();
          URL.revokeObjectURL(a.href);
        };
        var bShare = btn('🔗 复制分享链接');
        bShare.onclick = function () {
          fetch('/api/share', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ plan: p })
          }).then(function (r) {
            if (!r.ok) throw new Error('分享失败');
            return r.json();
          }).then(function (d) {
            return navigator.clipboard.writeText(location.origin + '/?shared=' + d.id).then(function () {
              bShare.textContent = '✅ 链接已复制（7天有效）';
              setTimeout(function () { bShare.textContent = '🔗 复制分享链接'; }, 2500);
            });
          }).catch(function () {
            bShare.textContent = '⚠️ 分享失败';
            setTimeout(function () { bShare.textContent = '🔗 复制分享链接'; }, 2500);
          });
        };
        var bPrint = btn('🖨️ 打印 / 存 PDF');
        bPrint.onclick = function () {
          var pr = document.getElementById('printroot');
          pr.innerHTML = '';
          pr.appendChild(plan.cloneNode(true));
          document.body.classList.add('print-mode');
          window.print();
        };
        actions.appendChild(bCopy); actions.appendChild(bMd); actions.appendChild(bHtml); actions.appendChild(bShare); actions.appendChild(bPrint);
        plan.appendChild(actions);

        this.planBox.appendChild(plan);
        window.addEventListener('afterprint', function () {
          document.body.classList.remove('print-mode');
          document.getElementById('printroot').innerHTML = '';
        });

        // 初始化地图（DOM 就绪后）
        if (allPts.length && window.L) {
          var map = L.map(mapDiv, { scrollWheelZoom: false });
          L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap'
          }).addTo(map);
          (p.days || []).forEach(function (d, di) {
            var color = PALETTE[di % PALETTE.length];
            var dp = (d.segments || []).filter(function (s) { return s.lat && s.lng; });
            dp.forEach(function (s) {
              L.circleMarker([s.lat, s.lng], { radius: 9, color: '#fff', weight: 2.5, fillColor: color, fillOpacity: 1 })
                .addTo(map)
                .bindPopup('<b>Day ' + d.day + ' · ' + (s.time || '') + '</b><br>' + (s.title || s.place || ''));
            });
            if (dp.length >= 2) {
              L.polyline(dp.map(function (s) { return [s.lat, s.lng]; }), { color: color, weight: 3, opacity: 0.85 }).addTo(map);
            }
          });
          var bounds = allPts.map(function (x) { return [x.s.lat, x.s.lng]; });
          map.fitBounds(bounds, { padding: [26, 26], maxZoom: 12 });
          this.planMap = map;
        }
        scrollBottom();
      },
      setItinerary: function (markdown) { // 降级：文本模式
        if (this.planMap) { try { this.planMap.remove(); } catch (e) {} this.planMap = null; }
        this.planBox.innerHTML = '';
        state.lastMd = markdown;
        this.md.innerHTML = renderMd(markdown);
        var tools = el('div', 'tools');
        var btnCopy = el('button', '', '📋 复制行程');
        btnCopy.onclick = function () {
          navigator.clipboard.writeText(markdown).then(function () {
            btnCopy.textContent = '✅ 已复制';
            setTimeout(function () { btnCopy.textContent = '📋 复制行程'; }, 1500);
          });
        };
        var btnDl = el('button', '', '⬇️ 下载 .md');
        btnDl.onclick = function () {
          var blob = new Blob([markdown], { type: 'text/markdown;charset=utf-8' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = '旅行行程.md';
          a.click();
          URL.revokeObjectURL(a.href);
        };
        tools.appendChild(btnCopy); tools.appendChild(btnDl);
        this.md.appendChild(tools);
        scrollBottom();
      }
    };
    return ui;
  }

  // ---------- 发送与 SSE ----------
  function setBusy(b) {
    state.busy = b;
    sendBtn.disabled = b;
    input.disabled = b;
  }

  function send(text) {
    if (state.busy || !text.trim()) return;
    if (welcome) welcome.style.display = 'none';
    state.messages.push({ role: 'user', content: text });
    addUser(text);
    input.value = '';
    autoGrow();
    var ui = addAi();
    setBusy(true);
    scrollBottom();

    fetch('/api/plan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: state.messages.slice(-10) })
    }).then(function (res) {
      if (!res.ok || !res.body) throw new Error('服务返回 ' + res.status + '，请确认服务已启动');
      var reader = res.body.getReader();
      var dec = new TextDecoder();
      var buf = '';
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) return finish();
          buf += dec.decode(r.value, { stream: true });
          var parts = buf.split('\n\n');
          buf = parts.pop();
          parts.forEach(function (p) {
            var line = p.split('\n').find(function (l) { return l.indexOf('data:') === 0; });
            if (!line) return;
            var ev;
            try { ev = JSON.parse(line.slice(5).trim()); } catch (e) { return; }
            handle(ev, ui);
          });
          return pump();
        });
      }
      return pump();
    }).catch(function (e) {
      ui.showError(e.message || String(e));
      finish();
    });

    function finish() {
      setBusy(false);
      input.focus();
      if (state.lastMd) {
        state.messages.push({ role: 'assistant', content: state.lastMd });
        state.lastMd = '';
      } else if (ui.qbox.textContent) {
        state.messages.push({ role: 'assistant', content: ui.qbox.textContent });
      }
    }
  }

  function handle(ev, ui) {
    if (ev.type === 'step') ui.upsertStep(ev);
    else if (ev.type === 'prices') ui.addPrices(ev);
    else if (ev.type === 'question') {
      ui.qbox.textContent = '💬 ' + ev.text;
      ui.steps.style.display = 'none';
    } else if (ev.type === 'itinerary_json') ui.setPlan(ev.plan);
    else if (ev.type === 'itinerary') ui.setItinerary(ev.markdown);
    else if (ev.type === 'weather') ui.weather = ev;
    else if (ev.type === 'currency') ui.currency = ev;
    else if (ev.type === 'error') ui.showError(ev.message);
  }

  // ---------- 输入框 ----------
  function addUser(text) {
    var m = el('div', 'msg user');
    m.appendChild(el('div', 'bubble', text));
    thread.appendChild(m);
  }
  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(140, input.scrollHeight) + 'px';
  }
  input.addEventListener('input', autoGrow);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input.value); }
  });
  sendBtn.addEventListener('click', function () { send(input.value); });
  document.querySelectorAll('.chip').forEach(function (c) {
    c.addEventListener('click', function () { send(c.textContent); });
  });
  document.getElementById('newChat').addEventListener('click', function () {
    state.messages = []; state.lastMd = '';
    thread.innerHTML = '';
    thread.appendChild(welcome);
    welcome.style.display = '';
  });
  input.focus();

  // ---------- 分享视图：?shared=<id> 只读展示 ----------
  var sharedId = new URLSearchParams(location.search).get('shared');
  if (sharedId) {
    welcome.style.display = 'none';
    fetch('/api/share/' + encodeURIComponent(sharedId))
      .then(function (r) {
        if (!r.ok) throw new Error('not found');
        return r.json();
      })
      .then(function (plan) {
        welcome.style.display = 'none';
        var ui = addAi();
        ui.setPlan(plan);
      })
      .catch(function () {
        welcome.style.display = '';
        var m = el('div', 'msg ai');
        var b = el('div', 'bubble');
        b.appendChild(el('div', 'errline', '⚠️ 分享不存在或已过期（链接 7 天有效）'));
        m.appendChild(b);
        thread.appendChild(m);
      });
  }
})();
</script>
</body>

# @local/xinglv-llm-bridge — 行旅本机大模型桥
#
# 顶层必须是 YAML 数组：单条无 id 的 insert 会追加到根 entry 列表。
# entry 自带 id/name/config；bare 包名不会被 anchorInsertedPluginNames 转成 file:// URL。
#
# 端口 8789 是刻意选的：8788 已被 @local/dsh-anywhere-inject 占用，
# 8791/8792/8793 是它的 fallbackPorts。
- insert:
    - id: xinglv-llm-bridge
      name: '@local/xinglv-llm-bridge'
      config:
        host: 127.0.0.1
        port: 8789
        fallbackPorts: [8794, 8795, 8796]
        # 留空 = 跟随 DSH 当前默认模型（agent-default-model 的 currentSelection()）。
        provider: ''
        model: ''
        maxMessages: 20
        maxTotalChars: 8000
        maxMessageChars: 4000
        # 公网模式（给手机用）。手机访问不到 127.0.0.1，只能靠隧道
        # （cloudflared 等）把公网域名指到本桥。
        #
        # 打开后：Host 变成公网域名也放行，但**公网侧拿不到主 token**，
        # 必须先配对（电脑上读 6 位码 → 手机输入 → 换会话令牌）。
        # 关掉（false）则退回到「只认 loopback」，与本插件最初的行为一致。
        publicAccess: true
        # quick tunnel 的域名每次启动都变，无法预先写进 publicHosts；
        # 只有打开这个开关才放行 `*.trycloudflare.com`。
        allowQuickTunnel: true
        # 若用固定域名的命名隧道，把域名写在这里（小写，不含协议与端口）。
        publicHosts: []
        # 域名**后缀**白名单，给「后缀固定、前缀随机」的隧道用 —— 典型是
        # localhost.run，域名形如 `xxxx.lhr.life`，每次连接都可能变，没法预先
        # 写进 publicHosts。写 ["lhr.life"] 就放行任何 `<单层子域>.lhr.life`；
        # 匹配锚定后缀，`evil-lhr.life` 不会过。
        #
        # 取舍：后缀越短越宽，可被撞名的风险越大（`["life"]` 这种单段后缀
        # 等于放开整个 TLD，代码会直接忽略）。只填自己确实在用的服务，
        # 用完就清空；不要为了图方便留一个宽后缀在这里。
        publicHostSuffixes: []
